<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>OSTM - Visualisation Tunnel SSH SVG</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #080d18;
      color: #ecf2ff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      box-sizing: border-box;
    }
    .card {
      background: #101727;
      border: 1px solid #26334c;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      max-width: 620px;
      width: 100%;
    }
    .title {
      font-size: 1rem;
      font-weight: 600;
      color: #8e9bb2;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(86, 217, 195, 0.12);
      border: 1px solid rgba(86, 217, 195, 0.3);
      color: #56d9c3;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-live::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #56d9c3;
      box-shadow: 0 0 8px #56d9c3;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    svg.ssh-tunnel-svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="title">
    <span>Visualisation du Conduit SSH</span>
    <span class="badge-live">CHIFFREMENT ACTIF</span>
  </div>

  <svg viewBox="0 0 540 120" class="ssh-tunnel-svg" role="img" aria-label="Visualisation haut de gamme du tunnel SSH">
    <defs>
      <!-- Lueurs néon avancées -->
      <filter id="glow-cyan" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur1" />
        <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur2" />
        <feMerge>
          <feMergeNode in="blur1" />
          <feMergeNode in="blur2" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <filter id="glow-violet" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur1" />
        <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur2" />
        <feMerge>
          <feMergeNode in="blur1" />
          <feMergeNode in="blur2" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6" />
      </filter>

      <!-- Dégradés du conduit principal -->
      <linearGradient id="tunnel-outer-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#151f33" stop-opacity="0.9" />
        <stop offset="30%" stop-color="#1a2742" stop-opacity="0.6" />
        <stop offset="50%" stop-color="#1e2c4b" stop-opacity="0.8" />
        <stop offset="70%" stop-color="#1a2742" stop-opacity="0.6" />
        <stop offset="100%" stop-color="#151f33" stop-opacity="0.9" />
      </linearGradient>

      <linearGradient id="tunnel-stroke-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#56d9c3" stop-opacity="0.6" />
        <stop offset="50%" stop-color="#7a8cff" stop-opacity="0.3" />
        <stop offset="100%" stop-color="#7a8cff" stop-opacity="0.6" />
      </linearGradient>

      <!-- Dégradé du noyau plasma intérieur -->
      <linearGradient id="core-plasma" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#56d9c3" stop-opacity="0.25" />
        <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
        <stop offset="100%" stop-color="#7a8cff" stop-opacity="0.25" />
      </linearGradient>

      <!-- Traînée lumineuse Upload (vers la droite) -->
      <linearGradient id="comet-up" x1="100%" y1="0%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#56d9c3" stop-opacity="1" />
        <stop offset="40%" stop-color="#56d9c3" stop-opacity="0.6" />
        <stop offset="100%" stop-color="#56d9c3" stop-opacity="0" />
      </linearGradient>

      <!-- Traînée lumineuse Download (vers la gauche) -->
      <linearGradient id="comet-down" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#7a8cff" stop-opacity="1" />
        <stop offset="40%" stop-color="#7a8cff" stop-opacity="0.6" />
        <stop offset="100%" stop-color="#7a8cff" stop-opacity="0" />
      </linearGradient>
    </defs>

    <!-- Rail d'arrière-plan du tunnel avec lueur discrète -->
    <rect x="85" y="38" width="370" height="44" rx="22" fill="url(#tunnel-outer-grad)" stroke="url(#tunnel-stroke-grad)" stroke-width="1.5" />
    <rect x="91" y="44" width="358" height="32" rx="16" fill="url(#core-plasma)" />

    <!-- Lignes de guidage et micro-anneaux technologiques -->
    <line x1="95" y1="60" x2="445" y2="60" stroke="#26334c" stroke-dasharray="3 4" stroke-width="1.2" />
    
    <!-- Segments laser du conduit -->
    <line x1="180" y1="42" x2="180" y2="78" stroke="#26334c" stroke-width="1" stroke-dasharray="2 3" />
    <line x1="360" y1="42" x2="360" y2="78" stroke="#26334c" stroke-width="1" stroke-dasharray="2 3" />

    <!-- Chevrons directionnels du sens de forwarding (subtils en arrière-plan) -->
    <g fill="none" stroke="#2a3b5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M140 54 l6 6 -6 6" />
      <path d="M152 54 l6 6 -6 6" />
      <path d="M380 54 l6 6 -6 6" />
      <path d="M392 54 l6 6 -6 6" />
    </g>

    <!-- Chemins pour l'animation des flux de données -->
    <!-- Canal A : Upload (Local -> Remote, voie haute Y=52) -->
    <path id="path-upload" d="M 85,52 L 455,52" fill="none" stroke="none" />
    <!-- Canal B : Download (Remote -> Local, voie basse Y=68) -->
    <path id="path-download" d="M 455,68 L 85,68" fill="none" stroke="none" />

    <!-- FLUX LUMINEUX PARTICULES : Upload (Cyan / ↗) -->
    <!-- Particule A1 avec traînée comète -->
    <g>
      <animateMotion dur="2.2s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1">
        <mpath href="#path-upload" />
      </animateMotion>
      <rect x="-18" y="-2" width="18" height="4" rx="2" fill="url(#comet-up)" />
      <circle cx="0" cy="0" r="3.5" fill="#ffffff" filter="url(#glow-cyan)" />
    </g>
    <!-- Particule A2 (décalée dans le temps) -->
    <g>
      <animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1">
        <mpath href="#path-upload" />
      </animateMotion>
      <rect x="-14" y="-1.5" width="14" height="3" rx="1.5" fill="url(#comet-up)" opacity="0.8" />
      <circle cx="0" cy="0" r="2.8" fill="#56d9c3" filter="url(#glow-cyan)" />
    </g>

    <!-- FLUX LUMINEUX PARTICULES : Download (Indigo / ↙) -->
    <!-- Particule B1 avec traînée comète -->
    <g>
      <animateMotion dur="2.6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1">
        <mpath href="#path-download" />
      </animateMotion>
      <rect x="0" y="-2" width="18" height="4" rx="2" fill="url(#comet-down)" />
      <circle cx="0" cy="0" r="3.5" fill="#ffffff" filter="url(#glow-violet)" />
    </g>
    <!-- Particule B2 (décalée dans le temps) -->
    <g>
      <animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1">
        <mpath href="#path-download" />
      </animateMotion>
      <rect x="0" y="-1.5" width="14" height="3" rx="1.5" fill="url(#comet-down)" opacity="0.8" />
      <circle cx="0" cy="0" r="2.8" fill="#7a8cff" filter="url(#glow-violet)" />
    </g>

    <!-- BADGE CENTRAL : BOUCLIER DE CHIFFREMENT SSH -->
    <g transform="translate(270, 60)" filter="url(#badge-shadow)">
      <!-- Hexagone de protection -->
      <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="#0b1020" stroke="#7a8cff" stroke-width="1.6" />
      <polygon points="0,-13 11,-6 11,6 0,13 -11,6 -11,-6" fill="rgba(122, 140, 255, 0.12)" />
      <!-- Icône Cadenas sécurisé -->
      <path d="M-4,-2 v-3 a4,4 0 0,1 8,0 v3 m-5,0 h10 v8 h-10 z" fill="none" stroke="#ecf2ff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Point laser central du cadenas -->
      <circle cx="1" cy="2" r="1" fill="#56d9c3" />
    </g>
    <!-- Micro-label sous le bouclier -->
    <text x="270" y="92" font-size="8.5" fill="#7a8cff" font-weight="700" letter-spacing="0.1em" text-anchor="middle" opacity="0.85">SSH TUNNEL</text>

    <!-- NŒUD SOURCE : MACHINE LOCALE (À GAUCHE) -->
    <g transform="translate(48, 60)" filter="url(#badge-shadow)">
      <!-- Halo externe pulsant -->
      <circle r="30" fill="none" stroke="#56d9c3" stroke-width="1" opacity="0.25">
        <animate attributeName="r" values="28;33;28" dur="3s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.3;0.08;0.3" dur="3s" repeatCount="indefinite" />
      </circle>
      <!-- Base du nœud -->
      <rect x="-24" y="-24" width="48" height="48" rx="14" fill="#101727" stroke="#56d9c3" stroke-width="2" />
      <!-- Icône Terminal / Client -->
      <g stroke="#56d9c3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="-14" y="-12" width="28" height="20" rx="3" stroke="#8e9bb2" stroke-width="1.4" />
        <path d="M-9 -4 l4 4 -4 4" />
        <line x1="-2" y1="4" x2="4" y2="4" />
      </g>
      <!-- Pastille d'état verte -->
      <circle cx="15" cy="-15" r="4.5" fill="#101727" stroke="#56d9c3" stroke-width="1.5" />
      <circle cx="15" cy="-15" r="2.5" fill="#56d9c3" />
      <!-- Labels -->
      <text y="38" font-size="10.5" fill="#ecf2ff" font-weight="700" text-anchor="middle" letter-spacing="0.04em">LOCAL</text>
      <text y="49" font-size="8" fill="#8e9bb2" text-anchor="middle">CLIENT</text>
    </g>

    <!-- NŒUD DESTINATION : SERVEUR DISTANT (À DROITE) -->
    <g transform="translate(492, 60)" filter="url(#badge-shadow)">
      <!-- Halo externe pulsant -->
      <circle r="30" fill="none" stroke="#7a8cff" stroke-width="1" opacity="0.25">
        <animate attributeName="r" values="28;33;28" dur="3.4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.3;0.08;0.3" dur="3.4s" repeatCount="indefinite" />
      </circle>
      <!-- Base du nœud -->
      <rect x="-24" y="-24" width="48" height="48" rx="14" fill="#101727" stroke="#7a8cff" stroke-width="2" />
      <!-- Icône Serveur Distant / Rack -->
      <g stroke="#7a8cff" stroke-width="1.4" stroke-linecap="round" fill="none">
        <rect x="-13" y="-14" width="26" height="8" rx="2" stroke="#8e9bb2" />
        <circle cx="7" cy="-10" r="1" fill="#7a8cff" />
        <rect x="-13" y="-3" width="26" height="8" rx="2" stroke="#8e9bb2" />
        <circle cx="7" cy="1" r="1" fill="#7a8cff" />
        <rect x="-13" y="8" width="26" height="8" rx="2" stroke="#8e9bb2" />
        <circle cx="7" cy="12" r="1" fill="#56d9c3" />
      </g>
      <!-- Pastille d'état violette -->
      <circle cx="15" cy="-15" r="4.5" fill="#101727" stroke="#7a8cff" stroke-width="1.5" />
      <circle cx="15" cy="-15" r="2.5" fill="#7a8cff" />
      <!-- Labels -->
      <text y="38" font-size="10.5" fill="#ecf2ff" font-weight="700" text-anchor="middle" letter-spacing="0.04em">REMOTE</text>
      <text y="49" font-size="8" fill="#8e9bb2" text-anchor="middle">SERVEUR</text>
    </g>
  </svg>
</div>

</body>
</html>
