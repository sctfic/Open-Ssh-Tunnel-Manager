name: Publish tunnel observatory

on:
  push:
    branches: [main]
    paths:
      - svg.html
      - .github/workflows/tunnel-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # La page autonome est la seule ressource nécessaire à cette démo.
      # Deux noms permettent l'accès à la racine et à l'URL explicite svg.html.
      - name: Prepare public demo
        run: |
          mkdir -p _site
          cp svg.html _site/index.html
          cp svg.html _site/svg.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
