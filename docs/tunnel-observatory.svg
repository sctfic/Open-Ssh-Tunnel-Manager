<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">OSTM : trajet d'une redirection SSH locale</title>
  <desc id="desc">Un paquet part d'un poste source, rejoint le client SSH, traverse un tunnel chiffré jusqu'au serveur SSH, puis atteint le service distant en clair. Les réponses suivent le trajet inverse.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0c1b25"/><stop offset="1" stop-color="#050a10"/></linearGradient>
    <linearGradient id="secure" x2="0" y2="1"><stop stop-color="#a995ff" stop-opacity=".22"/><stop offset=".5" stop-color="#8f7af0" stop-opacity=".035"/><stop offset="1" stop-color="#a995ff" stop-opacity=".22"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="42" height="28" patternUnits="userSpaceOnUse" patternTransform="skewX(-29)"><path d="M42 0H0V28" fill="none" stroke="#61adbb" stroke-opacity=".12" stroke-width=".7"/></pattern>
    <g id="server"><path d="m-43-76 68 20v85l-68-20Z" fill="#0b1923" stroke="#56808e"/><path d="m25-56 15-9v85L25 29Z" fill="#08121b" stroke="#345765"/><path d="m-43-76 15-9 68 20-15 9Z" fill="#17313b" stroke="#6893a0"/><g fill="none" stroke="#75cfd0"><path d="m-34-58 47 14v19l-47-14Z m0 30 47 14v19l-47-14Z"/><path d="m-28-52 24 7m-24 24 24 7"/></g><circle cx="8" cy="-49" r="2" fill="#65eddf" filter="url(#glow)"/><circle cx="8" cy="-19" r="2" fill="#65eddf" filter="url(#glow)"/></g>
    <g id="client"><path d="m-46-62 75 22v52l-75-22Z" fill="#0d202a" stroke="#65eddf"/><path d="m29-40 11-7v52l-11 7Z" fill="#09131d" stroke="#477887"/><path d="m-46-62 11-7 75 22-11 7Z" fill="#16333d" stroke="#6fc8cb"/><path d="m-34-48 9 8-9 4m17 4 20 6" fill="none" stroke="#65eddf" stroke-width="2"/><path d="M-7 13v19m-23 5 25-11 23 8-25 11Z" fill="#0d1e28" stroke="#508190"/></g>
    <g id="terminal"><path d="m-46-62 77 22v51l-77-22Z" fill="#0d202a" stroke="#65eddf"/><path d="m31-40 10-6v51l-10 6Z" fill="#09131d" stroke="#477887"/><path d="m-46-62 10-6 77 22-10 6Z" fill="#16333d" stroke="#6fc8cb"/><path d="m-34-48 9 8-9 4m17 4 20 6" fill="none" stroke="#65eddf" stroke-width="2"/></g>
  </defs>
  <rect width="1200" height="500" fill="url(#bg)"/>
  <path d="M20 130 350 79 1180 140v300L20 440Z" fill="url(#grid)"/>
  <path d="M25 35h22M25 35v22M1175 35h-22m22 0v22M25 465h22m-22 0v-22m1150 22h-22m22 0v-22" fill="none" stroke="#65eddf" stroke-width="2"/>
  <text x="48" y="58" fill="#65eddf" font-family="monospace" font-size="11" letter-spacing="3">OSTM / NETWORK OBSERVATORY</text>
  <text x="1152" y="58" text-anchor="end" fill="#6f8c99" font-family="monospace" font-size="10" letter-spacing="2">01 — LOCAL FORWARD / -L</text>
  <!-- Les surfaces externes restent visibles comme segments réseau en clair. -->
  <path d="M166 284 367 266M831 226 1034 263" fill="none" stroke="#65eddf" stroke-width="2" stroke-dasharray="4 8" opacity=".65"/>
  <!-- Le prisme relie précisément le client SSH au serveur SSH. -->
  <path d="M407 245 811 194v102l-404 56Z" fill="url(#secure)" stroke="#9a89e3" stroke-opacity=".7"/>
  <path d="M407 245 811 194M407 347 811 296" fill="none" stroke="#c2b5ff" stroke-opacity=".62"/>
  <ellipse cx="407" cy="296" rx="13" ry="51" fill="#a995ff14" stroke="#c2b5ff"/><ellipse cx="811" cy="245" rx="13" ry="51" fill="#a995ff14" stroke="#c2b5ff"/>
  <g transform="translate(610 168)" font-family="monospace"><path d="m0 0 10-6 10 6v12l-10 6L0 12Z" fill="#17132b" stroke="#b6a4ff"/><path d="M6 6V3a4 4 0 0 1 8 0v3M5 6h11v7H5Z" fill="none" stroke="#e1dcff"/><text x="31" y="3" fill="#e1dcff" font-size="12" letter-spacing="2">SSH TRANSPORT</text><text x="31" y="20" fill="#a99bda" font-size="9" letter-spacing="1.4">CHIFFRÉ · COMPRESSÉ · LIMITÉ</text></g>
  <text x="287" y="233" fill="#65eddf" font-family="monospace" font-size="10" letter-spacing="1">EN CLAIR</text><text x="924" y="221" fill="#65eddf" font-family="monospace" font-size="10" letter-spacing="1">EN CLAIR</text>
  <g transform="translate(165 284)"><path d="M-80 34 0 4 87 31 0 63Z" fill="#0b202b" stroke="#315968"/><use href="#terminal"/></g>
  <g transform="translate(395 297)"><path d="m-70 35 68-31 84 29-68 33Z" fill="#0b202b" stroke="#315968"/><use href="#client"/></g>
  <g transform="translate(825 245)"><path d="m-70 35-2-31 84 29-68 33Z" fill="#0b202b" stroke="#315968"/><use href="#server"/></g>
  <g transform="translate(1048 264)"><path d="M-80 34 0 4 87 31 0 63Z" fill="#0b202b" stroke="#315968"/><use href="#server"/></g>
  <g text-anchor="middle" font-family="monospace"><text x="165" y="384" fill="#6f9aaa" font-size="9" letter-spacing="1.5">01 / SOURCE</text><text x="165" y="405" fill="#deedf2" font-size="13">POSTE AMONT</text><text x="165" y="424" fill="#829ca8" font-size="10">192.168.1.24</text><text x="395" y="384" fill="#6f9aaa" font-size="9" letter-spacing="1.5">02 / ENTRÉE DU TUNNEL</text><text x="395" y="405" fill="#deedf2" font-size="13">CLIENT SSH</text><text x="395" y="424" fill="#829ca8" font-size="10">0.0.0.0:8080</text><text x="825" y="332" fill="#6f9aaa" font-size="9" letter-spacing="1.5">03 / SORTIE DU TUNNEL</text><text x="825" y="353" fill="#deedf2" font-size="13">SERVEUR SSH</text><text x="825" y="372" fill="#829ca8" font-size="10">ssh.example.net:22</text><text x="1048" y="370" fill="#6f9aaa" font-size="9" letter-spacing="1.5">04 / DESTINATION</text><text x="1048" y="391" fill="#deedf2" font-size="13">SERVICE FINAL</text><text x="1048" y="410" fill="#829ca8" font-size="10">10.20.0.50:80</text></g>
  <text x="48" y="468" fill="#72909d" font-family="monospace" font-size="9" letter-spacing="1.3">REQUÊTE → → →     /     ← ← ← RÉPONSE · LES LIENS EXTERNES NE SONT PAS PROTÉGÉS PAR SSH</text>
  <!-- Paquets animés montrent le parcours de la requête et de sa réponse. -->
  <circle r="3" fill="#72fff0" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite" path="M165 284L395 297C530 289 690 267 825 245L1048 264"/></circle>
  <circle r="2" fill="#e2dfff"><animateMotion dur="4s" begin="-2s" repeatCount="indefinite" path="M1048 275L825 256C690 278 530 300 395 308L165 295"/></circle>
</svg>
