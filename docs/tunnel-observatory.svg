<!-- Scène issue de svg.html, mode -L. Styles et géométrie repris à l’identique.
     Grille, anneaux et particules matérialisés pour une image SVG autonome. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="570" class="scene" id="scene" viewBox="0 0 1400 570" role="img" aria-labelledby="scene-title scene-desc">
        <title id="scene-title">Redirection locale SSH, du poste source au service distant</title>
        <desc id="scene-desc">Quatre machines en perspective. Les segments externes sont en clair au niveau SSH. Seul le segment entre client et serveur SSH est chiffré, compressé et limité. Les réponses empruntent le chemin inverse.</desc>
        <style>
    .scene text { font-family:ui-monospace,"Cascadia Code",monospace; }
    .floor { stroke:#50778c; stroke-width:.7; opacity:.16; fill:none; }
    .node-face { fill:#0c1a26; stroke:#487084; stroke-width:1; }
    .node-top { fill:#132f3b; stroke:#638a9a; stroke-width:1; }
    .node-side { fill:#09131f; stroke:#32556a; stroke-width:1; }
    .node-wire { fill:none; stroke:#77c5d3; stroke-width:1.2; }
    .beam { stroke:#65eddf; fill:none; }
    .plain { stroke:#65eddf; stroke-width:2; stroke-dasharray:5 6; fill:none; opacity:.65; }
    .encrypted { stroke:#a99afa; stroke-width:2; fill:none; opacity:.9; }
    .label { fill:#dceaf0; font-size:14px; letter-spacing:1px; }
    .caption { fill:#7797a9; font-size:10px; }
    .micro { fill:#8faab7; font-size:9px; letter-spacing:1.5px; }
    .flow-label { fill:#65eddf; font-size:10px; }
    .packet { fill:#65eddf; filter:url(#glow); }
    .return-packet { fill:#d9e7f0; opacity:.65; }

    @media (prefers-reduced-motion: reduce) { #packets { display: none; } }
  </style>
        <defs>
          <filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="3"/><feComposite in="SourceGraphic" operator="over"/></filter>
          <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b6a1ff" stop-opacity=".18"/><stop offset=".5" stop-color="#8576ff" stop-opacity=".025"/><stop offset="1" stop-color="#8e70ee" stop-opacity=".2"/></linearGradient>
          <linearGradient id="projection" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#69eade" stop-opacity="0"/><stop offset="1" stop-color="#69eade" stop-opacity=".1"/></linearGradient>
          <radialGradient id="halo"><stop stop-color="#6de4db" stop-opacity=".14"/><stop offset="1" stop-color="#6de4db" stop-opacity="0"/></radialGradient>
          <!-- Les quatre nœuds partagent ces volumes ; les labels restent hors
               des transformations pour préserver une typographie très lisible. -->
          <g id="platform"><ellipse cx="0" cy="24" rx="110" ry="44" fill="url(#halo)"/><path d="m-82 12 64-34 101 34-64 37Z" fill="#0b202b" stroke="#2b5363"/><path d="m-82 12 64-34 101 34-64 37Z" transform="translate(0 7)" fill="none" stroke="#1d394b"/><path d="m-70 13 53-27 88 27-53 29Z" fill="none" stroke="#63d8d6" opacity=".3"/><path d="M-68-80-80 13 19 48 69 15 53-80Z" fill="url(#projection)"/></g>
          <g id="rack"><path class="node-side" d="m18-96 34-18v96L18 0Z"/><path class="node-face" d="m-44-116 62 20V0l-62-20Z"/><path class="node-top" d="m-44-116 34-18 62 20-34 18Z"/><g class="node-wire"><path d="m-35-94 44 14v18l-44-14Z m0 33 44 14v18l-44-14Z"/><path d="m-30-86 22 7m-22 26 22 7"/><path d="m25-88 19-10m-19 21 19-10m-19 21 19-10m-19 21 19-10" opacity=".45"/></g><circle cx="1" cy="-71" r="2" fill="#7af2d7" filter="url(#glow)"/><circle cx="1" cy="-38" r="2" fill="#b39fff" filter="url(#glow)"/><path d="m-30-24 27 9" stroke="#82d5d9"/></g>
          <g id="desktop"><path class="node-face" d="m-49-104 82 25v58l-82-25Z"/><path class="node-side" d="m33-79 10-6v58l-10 6Z"/><path class="node-top" d="m-49-104 10-6 82 25-10 6Z"/><path d="m-40-91 62 19v36l-62-19Z" fill="#10343d" stroke="#488796"/><path d="m-30-74 10 10-10 4m19 2 18 6" stroke="#73e8df" fill="none" stroke-width="2"/><path d="M-7-33v21m-23 3 25-11 23 8-25 11Z" class="node-wire"/></g>
        </defs>
