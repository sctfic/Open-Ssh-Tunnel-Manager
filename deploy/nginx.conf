# Replace domain and certificate paths before enabling this configuration.
server {
    listen 80;
    server_name ostm.example.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ostm.example.net;
    ssl_certificate /etc/letsencrypt/live/ostm.example.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ostm.example.net/privkey.pem;
    client_max_body_size 128k;

    location /api/v2/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
