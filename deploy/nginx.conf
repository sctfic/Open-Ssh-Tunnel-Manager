# Modèle de production : remplacer domaine et certificats avant activation.
server {
    listen 80;
    server_name ostm.example.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ostm.example.net;
    ssl_certificate /etc/letsencrypt/live/ostm.example.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ostm.example.net/privkey.pem;
    client_max_body_size 128k;

    # Frontend Vanilla JS statique : aucun build n'est nécessaire sur le serveur.
    root /opt/ostm/frontend;
    index index.html;
    location = / { try_files /index.html =404; }
    # Les fichiers ne sont pas renommés par un bundler : revalider évite de garder
    # une ancienne version de l'interface après un déploiement.
    location /assets/ { try_files $uri =404; add_header Cache-Control "no-cache"; }
    location = /favicon.svg { try_files $uri =404; expires 1d; }

    location /api/v2/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Indispensable aux événements SSE envoyés chaque seconde.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    location = /health { proxy_pass http://127.0.0.1:4000; }
}
