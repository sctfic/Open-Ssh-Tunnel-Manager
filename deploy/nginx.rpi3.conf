server {
    listen 8443 ssl;
    server_name rpi3.lan;
    ssl_certificate /etc/ssl/certs/ostm-rpi3-test.crt;
    ssl_certificate_key /etc/ssl/private/ostm-rpi3-test.key;
    client_max_body_size 128k;

    location = / {
        default_type application/json;
        return 200 '{"service":"Open SSH Tunnel Manager","api":"/api/v2/","status":"test"}';
    }
    location = /health {
        proxy_pass http://127.0.0.1:4000;
    }
    location /api/v2/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
